aid: jsw-one
name: JSW One
description: >-
  JSW One Platforms is the digital B2B arm of India's JSW Group, operating a full-stack
  e-commerce and services platform for the country's manufacturing and construction MSMEs.
  It runs four connected businesses on one technology stack: JSW One Commerce
  (jswonemsme.com), a multi-brand marketplace for TMT bars, mild/hot-rolled/cold-rolled and
  structural steel, coated steel, wire rods, cement and bitumen sourced from certified mills;
  JSW One Homes (jswonehomes.com), a turnkey home-construction service with digital project
  tracking across fifteen Indian cities; JSW One Finance, the NBFC arm providing digital
  credit lines, channel financing and invoice factoring to MSMEs and retailers; and private
  brands JSW One TMT and One Helix. The platform reported FY25 gross merchandise value of
  INR 12,567 crore across more than 84,000 registered MSMEs, and raised INR 575 crore in a
  2025 round led by the State Bank of India. JSW One publishes no public developer program,
  API reference or machine-readable contract; its customer-facing surfaces are the web
  marketplace and the JSW One MSME mobile apps. It does publish a maintained llms.txt on both
  of its consumer properties, plus an explicit AI/LLM bot-access policy on JSW One Homes.
