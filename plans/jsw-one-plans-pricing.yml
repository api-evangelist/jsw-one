  SKU, per tonne and per delivery location, and the live prices sit behind a registered-MSME
  login rather than on a public plans page. JSW One Homes prices turnkey home construction per
  project through a cost estimator, and JSW One Finance underwrites credit per borrower. None
  of these are API plans, subscription tiers, or metered developer pricing, so there is nothing
  for this artifact to enumerate.
